    <!-- Schema.org: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Precisa saber programar pra usar a OrcaLink?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. O editor é visual, arrastar e soltar. Se você sabe usar o Instagram, sabe usar a OrcaLink. Nenhuma linha de código necessária."
          }
        },
        {
          "@type": "Question",
          "name": "Qual a diferença pro Typeform ou Linktree?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Typeform coleta dados mas não calcula preço. Linktree só redireciona links. A OrcaLink é a única que gera orçamento automático para o cliente final, em português, feito para MEIs brasileiros."
          }
        },
        {
          "@type": "Question",
          "name": "Como o cliente paga o serviço pela OrcaLink?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A OrcaLink não processa pagamentos — ela gera o orçamento e conecta você com o cliente. O pagamento acontece como você preferir: Pix, cartão, boleto. Integração de pagamento está no roadmap."
          }
        },
        {
          "@type": "Question",
          "name": "E se meu preço variar muito por projeto?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Por isso o formulário é interativo. Você cria perguntas (qual o tamanho, tem deadline agressivo, etc) e cada resposta adiciona ou desconta valor automaticamente. O preço final é gerado com base nas escolhas do cliente."
          }
        },
        {
          "@type": "Question",
          "name": "O plano grátis é para sempre?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. Sem trial, sem cartão de crédito. O plano grátis com 1 formulário e 30 orçamentos/mês é seu para sempre. Upgrade só quando fizer sentido pra você."
          }
        },
        {
          "@type": "Question",
          "name": "Funciona pra qualquer profissão?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Qualquer profissional que cobra por serviço e recebe pedidos de orçamento no WhatsApp ou Instagram. Fotógrafo, designer, tatuador, personal, nutricionista, videomaker, advogado, arquiteto — todos."
          }
        }
      ]
    }
    </script>
